[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-code"
version = "2.5.6"
description = "An open-source Python package for prior-conditional estimation of chlorine production in membrane-free NaCl electrolysis."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ahmed Kasem" }
]
dependencies = [
    "numpy",
    "scipy",
    "pymc",
    "pytest"
]

[tool.setuptools]
py-modules = ["chlorine", "inference", "thermal", "utils"]